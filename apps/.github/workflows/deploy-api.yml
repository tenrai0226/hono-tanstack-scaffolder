name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    name: Deploy to Cloudflare and Sentry
    runs-on: ubuntu-latest
    
    # 将项目运行根目录指向 api
    defaults:
      run:
        working-directory: ./apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sentry set-commits 需要完整 git 历史

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 安装项目依赖（在根目录或 api 目录皆可，这里我们在 monorepo 根目录执行更稳定）
      - name: Install Dependencies
        working-directory: .
        run: bun install

      # 部署到 Cloudflare 并提取 .wrangler/dist 产物
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 动态注入 SENTRY_RELEASE 与 NODE_ENV
          bunx wrangler deploy --outdir .wrangler/dist --upload-source-maps --var SENTRY_RELEASE:${{ github.sha }} NODE_ENV:production

      # 上传 Source Maps 给 Sentry
      - name: Upload Source Maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: "tb2-api"
          SENTRY_RELEASE: ${{ github.sha }}
        run: bun run sentry:sourcemaps

      # 关联 Sentry Release 与 Git Commits（启用 Suspect Commits 功能）
      - name: Finalize Sentry Release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          bunx sentry-cli releases new -p tb2-api ${{ github.sha }}
          bunx sentry-cli releases set-commits --auto ${{ github.sha }}
          bunx sentry-cli releases finalize ${{ github.sha }}

